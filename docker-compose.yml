services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance_fivem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_fivem"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/attendance_fivem?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-docker-secret}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      LOGIN_RATE_LIMIT_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  pgdata:
